name: Update UNKNOWN Global News

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update news.json
        run: python update_news.py

      - name: Commit updated news
        run: |
          git config user.name "UNKNOWN News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Auto update global news"
          git pushEnternname: Update UNKNOWN Global News

