<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNKNOWN — Global News</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#070707;color:#fff}
header{position:sticky;top:0;z-index:10;background:#0b0b0beF;border-bottom:1px solid #292929;padding:16px}
nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}
.logo{font-size:24px;font-weight:800;letter-spacing:4px}
nav a{color:#aaa;text-decoration:none;margin-left:15px;font-size:14px}
nav a:hover{color:#fff}
.hero{max-width:1100px;margin:auto;padding:65px 18px 35px}
.hero h1{font-size:clamp(42px,9vw,80px);letter-spacing:8px}
.hero p{color:#999;margin-top:12px}
.status{margin-top:20px;color:#aaa;font-size:13px}
main{max-width:1100px;margin:auto;padding:0 18px 70px}
.filters{display:flex;gap:8px;overflow:auto;padding:10px 0 22px}
button{background:#111;color:#ddd;border:1px solid #333;border-radius:20px;padding:10px 15px;cursor:pointer;white-space:nowrap}
button.active,button:hover{background:#fff;color:#000}
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.card{background:#101010;border:1px solid #282828;border-radius:14px;padding:20px;display:flex;flex-direction:column;min-height:210px}
.badge{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.card h2{font-size:19px;line-height:1.35;margin-bottom:12px}
.meta{color:#777;font-size:12px;margin-top:auto;padding-top:18px}
.card a{display:inline-block;margin-top:14px;color:#fff;text-decoration:none;font-weight:bold}
.loading,.error{color:#999;padding:30px 0}
footer{border-top:1px solid #222;text-align:center;color:#666;padding:25px}
</style>
</head>
<body>
<header><nav><div class="logo">UNKNOWN</div><div>
<a href="index.html">Home</a><a href="#news">Global News</a>
</div></nav></header>

<section class="hero">
<h1>GLOBAL NEWS</h1>
<p>World headlines, automatically updated for the UNKNOWN virtual nation.</p>
<div class="status" id="status">Loading latest headlines…</div>
</section>

<main id="news">
<div class="filters">
<button class="active" data-cat="All">All</button>
<button data-cat="World">World</button>
<button data-cat="India">India</button>
<button data-cat="Technology">Technology</button>
<button data-cat="Gaming">Gaming</button>
<button data-cat="Sports">Sports</button>
</div>
<div id="newsList" class="news"><div class="loading">Loading news…</div></div>
</main>

<footer>
© 2026 UNKNOWN Virtual Nation · Headlines link to their original publishers.
</footer>

<script>
let allNews=[];
const list=document.getElementById("newsList");
const status=document.getElementById("status");

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function render(cat="All"){
  const items=cat==="All"?allNews:allNews.filter(x=>x.category===cat);
  if(!items.length){list.innerHTML='<div class="loading">No headlines available right now.</div>';return;}
  list.innerHTML=items.map(n=>`
    <article class="card">
      <div class="badge">${esc(n.category)} · ${esc(n.source)}</div>
      <h2>${esc(n.title)}</h2>
      <div class="meta">${esc(n.published)}</div>
      <a href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">Read at source →</a>
    </article>`).join("");
}
fetch("news.json?ts="+Date.now())
.then(r=>{if(!r.ok)throw new Error("news.json not found");return r.json()})
.then(data=>{
  allNews=data;
  status.textContent=`${data.length} headlines · Last automatic update: ${new Date().toLocaleString()}`;
  render();
})
.catch(e=>{
  status.textContent="News feed is temporarily unavailable.";
  list.innerHTML='<div class="error">Could not load news.json. Check the GitHub Actions update.</div>';
});
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); render(b.dataset.cat);
});
</script>
</body>
</html>
